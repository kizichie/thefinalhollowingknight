<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AVISALAAAA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="grain"></div>

<main>
  <header>
    <p class="eyebrow">C.C.C</p>
    <h1>a mosaic of all the people I know</h1>
    <p class="subtitle">Lov yoy guys</p>
    <div class="rule"></div>

    <div class="archive-tools">
      <label class="search-wrap" for="searchInput">
        <span>Search my mind??</span>
        <input id="searchInput" type="search" placeholder="Search your name??" autocomplete="off">
      </label>
      <p class="archive-count" id="archiveCount"></p>
    </div>
  </header>

  <section class="grid" id="lettersGrid"></section>
  <p class="empty-state" id="emptyState" hidden>Wala ka?? Please remind me of your name.</p>

  <footer>
    <div class="rule"></div>
    <p>I am me because of all these people.</p>
  </footer>
</main>

<!-- Letter modal -->
<div class="modal" id="modal" aria-hidden="true">
  <div class="backdrop" id="backdrop"></div>

  <article class="paper" id="paper">
    <button class="close" id="close" aria-label="Close letter">×</button>
    <div class="paperHead"><span id="number"></span><span id="date"></span></div>
    <h2 id="person"></h2>
    <div class="special-mark" id="specialMark" aria-hidden="true"></div>
    <div class="paperRule"></div>
    <div class="letter" id="letter"></div>

    <section class="voice-note" id="voiceNote" hidden style="display:none">
      <p>VOICE RECORDING</p>
      <div class="voice-player">
        <span class="voice-icon" aria-hidden="true">◉</span>
        <div class="voice-copy">
          <b id="voiceTitle">A voice, kept here.</b>
          <small id="voiceDescription">A recording attached to this special letter.</small>
        </div>
        <audio id="voiceAudio" controls preload="metadata"></audio>
      </div>
    </section>

    <section class="soundtrack">
      <p>SOUNDTRACK</p>
      <div class="song">
        <div>
          <b id="song"></b>
          <span id="artist"></span>
        </div>
      </div>
      <div class="spotify-frame" id="spotifyFrame"></div>
      <small id="spotifyNote">Replace the placeholder Spotify track ID in <code>script.js</code>.</small>
    </section>
  </article>
</div>

<div class="rain" id="rain"></div>
<script src="script.js"></script>
</body>
</html>
